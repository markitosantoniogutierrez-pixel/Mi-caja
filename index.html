<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi caja</title>
<style>
:root{--bg:#EFF3F8;--card:#FFFFFF;--ink:#0F1B2D;--mut:#5A6B80;--line:#DCE3EC;--acc:#1E4FD8;--acc2:#0E7490;--on:#fff;--pos:#0B7A55;--neg:#C73636;--c-compra:#2563EB;--c-venta:#0B7A55;--c-rem:#B45309;--c-ing:#7C3AED;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A111F;--card:#111A2C;--ink:#E8EEF8;--mut:#8DA0BA;--line:#223250;--acc:#5B9BFF;--acc2:#22C3C3;--on:#04122A;--pos:#34D399;--neg:#F87171;--c-compra:#60A5FA;--c-venta:#34D399;--c-rem:#FBBF24;--c-ing:#A78BFA;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A111F;--card:#111A2C;--ink:#E8EEF8;--mut:#8DA0BA;--line:#223250;--acc:#5B9BFF;--acc2:#22C3C3;--on:#04122A;--pos:#34D399;--neg:#F87171;--c-compra:#60A5FA;--c-venta:#34D399;--c-rem:#FBBF24;--c-ing:#A78BFA;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;padding-bottom:84px;-webkit-text-size-adjust:100%}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:14px;margin:18px 0 8px;color:var(--mut);font-weight:600}
main{padding:8px 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,27,45,.06),0 6px 16px rgba(15,27,45,.05);transition:border-color .15s}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.big{font-size:28px;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{color:var(--mut);font-size:13px}.pos{color:var(--pos)}.neg{color:var(--neg)}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.sm{padding:6px 10px;font-size:13px;border-radius:8px;width:auto}
.ic{background:none;border:0;color:var(--mut);font-size:20px;padding:6px;cursor:pointer}
.it{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;border-radius:12px;transition:background .15s,color .15s;color:var(--mut);font:inherit;font-size:12px;padding:6px 0;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--acc);font-weight:700;background:color-mix(in srgb,var(--acc) 14%,transparent)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
#ov.show{display:flex}
#sh{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;display:none;z-index:10}
.pv{background:var(--bg);border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px;min-height:20px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.btn{transition:transform .12s,filter .12s}.btn:active{transform:scale(.97);filter:brightness(.92)}.btn.alt:active{background:var(--bg)}nav button:active{transform:scale(.94)}.ic:active{opacity:.5}@media(hover:hover){.btn:hover{filter:brightness(1.08)}.card:hover{border-color:var(--acc)}}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);border:0}.hero .mut{color:var(--on);opacity:.85}.hero.g2{background:linear-gradient(135deg,var(--c-venta),var(--acc2))}.hero.warn{background:linear-gradient(135deg,var(--neg),#8B1E1E)}
.btn.b-compra{border-left:4px solid var(--c-compra)}.btn.b-venta{border-left:4px solid var(--c-venta)}.btn.b-rUS,.btn.b-rEU{border-left:4px solid var(--c-rem)}.btn.b-ing{border-left:4px solid var(--c-ing)}
.fx{display:flex;gap:6px;align-items:center}.fx input{flex:1;min-width:0}.fx button{margin-top:4px}
</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1E4FD8"><meta name="apple-mobile-web-app-title" content="Mi caja"></head><body>
<header><h1>Mi caja</h1><button class="ic" onclick="cfg()" aria-label="Ajustes">⚙</button></header>
<main id="v"></main>
<nav id="nv"></nav>
<div id="ov" onclick="if(event.target===this)closeS()"><div id="sh"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let D={s:{theme:'system',toque:0,tAt:'',pUS:2,pEU:3,cUSD:0,cCUP:0},ops:[],con:[],pen:[]},tab='home',q='',armed='',cu='',cc='';
try{const r=localStorage.getItem('mi-caja-v1');if(r){const j=JSON.parse(r);D={s:Object.assign(D.s,j.s||{}),ops:j.ops||[],con:j.con||[],pen:j.pen||[],cuad:j.cuad||[]}}}catch(e){}
const save=()=>{try{localStorage.setItem('mi-caja-v1',JSON.stringify(D));return true}catch(e){toast('No se pudo guardar: sin espacio. Haz una copia de seguridad.');return false}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=(v,d=2)=>(+v||0).toLocaleString('es',{minimumFractionDigits:d,maximumFractionDigits:d});
const nowISO=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const T={compra:'Compra de USD',venta:'Venta de USD',rUS:'Remesa desde EEUU',rEU:'Remesa desde la UE',ing:'Otro ingreso'};
const val=id=>parseFloat((($('#'+id)||{}).value||'').replace(',','.'))||0;
const txt=id=>(($('#'+id)||{}).value||'').trim();
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function th(){const t=D.s.theme;if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t}
function sheet(h){$('#sh').innerHTML=h;$('#ov').classList.add('show')}
function closeS(){$('#ov').classList.remove('show')}
function bal(){let u=+D.s.cUSD||0,c=+D.s.cCUP||0;for(const o of D.ops){const cup=o.usd*o.rate;if(o.t==='compra'){u+=o.usd;c-=cup}else if(o.t==='venta'){u-=o.usd;c+=cup}else if(o.t==='ing'){if(o.cur==='CUP')c+=o.usd;else u+=o.usd}else if(o.dest!=='remesero'){u-=o.usd*(1+(o.pp||0)/100)}}for(const p of D.pen)if(p.done){const s=p.dir==='me'?1:-1;if(p.cur==='CUP')c+=s*p.amt;else u+=s*p.amt}return{u,c}}
function gain(o){if(o.t==='ing')return{u:0,c:0};if(o.t[0]==='r')return{u:o.usd*(o.p-(o.pp||0))/100,c:0};if(!o.tq)return{u:0,c:0};return{u:0,c:(o.t==='venta'?o.rate-o.tq:o.tq-o.rate)*o.usd}}
function go(t){tab=t;armed='';R()}
function R(){
 const tabs=[['home','◎','Inicio'],['ops','☰','Operaciones'],['con','☺','Contactos'],['pen','◷','Pendientes'],['calc','＝','Calcular']];
 $('#nv').innerHTML=tabs.map(a=>`<button class="${tab===a[0]?'on':''}" onclick="go('${a[0]}')"><b>${a[1]}</b>${a[2]}</button>`).join('');
 $('#v').innerHTML=({home,ops,con,pen,calc})[tab]();
 if(tab==='ops')opl();
}
function home(){
 const b=bal(),F=ft(),tq=+D.s.toque||0,today=nowISO().slice(0,10);
 const hoy=D.ops.filter(o=>o.at.slice(0,10)===today);let gu=0,gc=0;hoy.forEach(o=>{const g=gain(o);gu+=g.u;gc+=g.c});
 const tot=tq?b.u+b.c/tq:null;
 return `<div class="card"><label>Tasa del toque (CUP por USD)<input id="tq" type="number" inputmode="decimal" step="any" value="${tq||''}" onchange="setTq(this.value)"></label>
 <div class="mut">${D.s.tAt?'Actualizada '+esc(D.s.tAt.replace('T',' ')):'Escríbela a mano cada vez que cambie.'}</div></div>
 <div class="grid"><div class="card hero${b.u<0?' warn':''}"><div class="mut">Capital USD</div><div class="num big">${n(b.u)}</div></div>
 <div class="card hero g2${b.c<0?' warn':''}"><div class="mut">Capital CUP</div><div class="num big">${n(b.c,0)}</div></div></div>
 ${tot!==null?`<div class="card row"><span class="mut">Todo en USD al toque</span><span class="num">${n(tot)} USD</span></div>`:''}
 <div class="card" style="border-left:4px solid var(--c-venta)"><div class="mut">Capital total (con lo que me deben)</div><div class="row"><span class="num big">${n(F.u)} USD</span><span class="num">${n(F.c,0)} CUP</span></div>${ctd()}</div><h3>Cuadre de caja</h3><div class="card"><div class="grid"><label>USD contados<input id="cu" type="number" inputmode="decimal" step="any" value="${cu}" oninput="cq()"></label>
 <label>CUP contados<input id="cc" type="number" inputmode="decimal" step="any" value="${cc}" oninput="cq()"></label></div><div id="cqr" class="mut"></div><button class="btn" style="margin-top:10px" onclick="cuadReg()">Registrar cuadre</button></div>${hcu()}
 <h3>Hoy</h3><div class="card"><div class="row"><span>Operaciones</span><span class="num">${hoy.length}</span></div>
 <div class="row"><span>Ganancia en remesas</span><span class="num pos">${n(gu)} USD</span></div>
 <div class="row"><span>Margen vs. toque</span><span class="num ${gc<0?'neg':'pos'}">${n(gc,0)} CUP</span></div></div>
 <h3>Registrar</h3><div class="grid">${Object.keys(T).map(t=>`<button class="btn alt b-${t}" onclick="opForm('${t}')">${T[t]}</button>`).join('')}</div>`;
}
function ft(){const b=bal();let u=b.u,c=b.c;for(const p of D.pen)if(!p.done){const s=p.dir==='me'?1:-1;if(p.cur==='CUP')c+=s*p.amt;else u+=s*p.amt}return{u,c}}
function dl(){const d=txt('f-d'),L=$('#cl');if(L)L.innerHTML=D.con.filter(c=>(c.tipo||'cliente')===d).map(c=>`<option value="${esc(c.name)}">`).join('')}
function cuad(id){const c=D.con.find(x=>x.id===id);if(!c)return;
 const k=c.name.toLowerCase(),pn=D.pen.filter(x=>!x.done&&x.who.toLowerCase()===k),sum=(d,u)=>pn.filter(x=>x.dir===d&&x.cur===u).reduce((s,x)=>s+x.amt,0),
 dbU=sum('debo','USD'),meU=sum('me','USD'),dbC=sum('debo','CUP'),meC=sum('me','CUP'),nu=dbU-meU,nc=dbC-meC,
 line=(x,u)=>{const r=Math.round(Math.abs(x));if(Math.abs(x)<.005)return`<div class="num big pos">A mano en ${u}</div>`;return`<div class="num big ${x>0?'neg':'pos'}">${x>0?'Le debes':'Te debe'} ${n(r,0)} ${u}</div>`+(Math.abs(Math.abs(x)-r)>=.005?`<div class="mut">Exacto: ${n(Math.abs(x),2)} ${u}</div>`:'')};
 sheet(`<h2>Cuadre con ${esc(c.name)}</h2><div class="card">${line(nu,'USD')}${Math.abs(nc)>=.005?`<div style="margin-top:8px">${line(nc,'CUP')}</div>`:''}</div>${pn.length?`<div class="card"><div class="row"><span>Le debo</span><span class="num neg">${n(dbU)} USD${dbC?' · '+n(dbC,0)+' CUP':''}</span></div><div class="row"><span>Me debe</span><span class="num pos">${n(meU)} USD${meC?' · '+n(meC,0)+' CUP':''}</span></div></div><div class="mut" style="margin-bottom:10px">Al marcar como saldado se cierran las ${pn.length} cuentas abiertas con ${esc(c.name)} y tu efectivo se ajusta.</div><button class="btn" onclick="cuadOk(${id})">Marcar todo como saldado</button>`:'<div class="mut">No hay cuentas abiertas con este contacto.</div>'}`)}
function cuadOk(id){const k=D.con.find(x=>x.id===id).name.toLowerCase();D.pen.forEach(x=>{if(!x.done&&x.who.toLowerCase()===k)x.done=true});save();closeS();R();toast('Cuadre hecho')}
function vis(id){const p=D.pen.find(x=>x.id===id)||D.ops.find(x=>x.id===id);if(p&&p.img)sheet(`<h2>${esc(p.who)}</h2><img src="${p.img}" alt="Captura" style="max-width:100%;border-radius:10px">`)}
function sg(id,t){const e=$('#'+id),v=e.value.trim();e.value=v[0]==='-'?v.slice(1):'-'+v;if(t)pv(t)}
function ctd(){let mu=0,mc=0,du=0,dc=0;for(const p of D.pen)if(!p.done){if(p.dir==='me'){if(p.cur==='CUP')mc+=p.amt;else mu+=p.amt}else{if(p.cur==='CUP')dc+=p.amt;else du+=p.amt}}
 const b=bal(),f=ft(),tq=+D.s.toque||0,X=(l,x,y,k)=>`<div class="row"><span class="mut">${l}</span><span class="num ${k||''}">${n(x)} USD · ${n(y,0)} CUP</span></div>`;
 return `<div style="margin-top:8px">${X('Efectivo',b.u,b.c)}${X('Me deben',mu,mc,'pos')}${X('Debo',du,dc,'neg')}${tq?`<div class="row"><span class="mut">Total en USD al toque</span><span class="num">${n(f.u+f.c/tq)} USD</span></div>`:''}</div>`}
function hcu(){const L=D.cuad||[];if(!L.length)return'';return `<h3>Cuadres registrados</h3><div class="card" style="padding:4px 14px">${L.slice(0,5).map(x=>`<div class="it"><div><b>${esc(x.at.replace('T',' '))}</b><div class="mut">Ajuste: ${n(x.du)} USD · ${n(x.dc,0)} CUP</div></div><div class="num" style="text-align:right">${n(x.u+x.du)} USD<div class="mut">${n(x.c+x.dc,0)} CUP</div></div></div>`).join('')}</div>`}
function cuadReg(){if(cu===''&&cc===''){toast('Escribe lo que contaste');return}const b=bal(),du=cu===''?0:(parseFloat(cu)||0)-b.u,dc=cc===''?0:(parseFloat(cc)||0)-b.c;
 sheet(`<h2>Registrar cuadre</h2><div class="card"><div class="row"><span>USD en sistema</span><span class="num">${n(b.u)}</span></div><div class="row"><span>USD contados</span><span class="num">${cu===''?'—':n(parseFloat(cu)||0)}</span></div><div class="row"><span>CUP en sistema</span><span class="num">${n(b.c,0)}</span></div><div class="row"><span>CUP contados</span><span class="num">${cc===''?'—':n(parseFloat(cc)||0,0)}</span></div></div><div class="mut" style="margin-bottom:10px">Se guarda el cuadre y tus fondos quedan iguales a lo contado (ajuste: ${n(du)} USD, ${n(dc,0)} CUP).</div><button class="btn" onclick="cuadSave(${du},${dc})">Confirmar y registrar</button>`)}
function cuadSave(du,dc){const b=bal();D.cuad=D.cuad||[];D.cuad.unshift({id:Date.now(),at:nowISO(),u:b.u,c:b.c,du,dc});D.s.cUSD=(+D.s.cUSD||0)+du;D.s.cCUP=(+D.s.cCUP||0)+dc;cu='';cc='';save();closeS();R();toast('Cuadre registrado')}
function editPct(id){const o=D.ops.find(x=>x.id===id);if(!o)return;sheet(`<h2>Editar porcientos</h2><div class="mut" style="margin-bottom:10px">${esc(o.who)} · ${n(o.usd)} USD</div><label>Porciento que me pagan (%)<div class="fx"><input id="e-p" type="text" inputmode="decimal" value="${o.p}"><button type="button" class="btn alt sm" onclick="sg('e-p')">±</button></div></label><label>Porciento que le pago (%)<div class="fx"><input id="e-pp" type="text" inputmode="decimal" value="${o.pp||0}"><button type="button" class="btn alt sm" onclick="sg('e-pp')">±</button></div></label><button class="btn" onclick="savePct(${id})">Guardar cambios</button>`)}
function savePct(id){const o=D.ops.find(x=>x.id===id);o.p=val('e-p');o.pp=val('e-pp');D.pen.forEach(x=>{if(x.rid===id)x.amt=+(o.usd*(1+(x.dir==='me'?o.p:o.pp)/100)).toFixed(2)});save();closeS();R()}
function setTq(v){D.s.toque=parseFloat(v)||0;D.s.tAt=nowISO();save();R()}
function cq(){cu=$('#cu').value;cc=$('#cc').value;const b=bal(),el=$('#cqr');if(cu===''&&cc===''){el.textContent='';return}
 const du=(parseFloat(cu)||0)-b.u,dc=(parseFloat(cc)||0)-b.c,f=(x,u,d)=>Math.abs(x)<.005?'<span class="pos">cuadra</span>':`<span class="${x<0?'neg':'pos'}">${x>0?'sobran ':'faltan '}${n(Math.abs(x),d)} ${u}</span>`;
 el.innerHTML=(cu!==''?'USD: '+f(du,'USD',2)+'. ':'')+(cc!==''?'CUP: '+f(dc,'CUP',0):'')}
function ingForm(){sheet(`<h2>Otro ingreso</h2><label>Concepto<input id="f-note" placeholder="Ej: venta de recarga"></label><div class="grid"><label>Monto<input id="f-usd" type="number" inputmode="decimal" step="any"></label><label>Moneda<select id="f-cur"><option>USD</option><option>CUP</option></select></label></div><label>Fecha y hora<input id="f-at" type="datetime-local" value="${nowISO()}"></label><button class="btn" onclick="saveOp('ing')">Guardar ingreso</button>`)}
function opForm(t){if(t==='ing')return ingForm();const r=t[0]==='r',p=t==='rUS'?D.s.pUS:D.s.pEU;
 sheet(`<h2>${T[t]}</h2>${r?`<label>Entregar a<select id="f-d" onchange="dl();pv('${t}')"><option value="cliente">Cliente</option><option value="remesero">Remesero</option></select></label>`:''}<label>${r?'Nombre':'Contacto'}<input id="f-who" list="cl" autocomplete="off" placeholder="Nombre"></label><datalist id="cl">${D.con.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
 <label>${r?'Dinero enviado (USD)':'Monto en USD'}<input id="f-usd" type="number" inputmode="decimal" step="any" oninput="pv('${t}')"></label>
 ${r?'':`<label>Tasa (CUP por USD)<input id="f-rate" type="number" inputmode="decimal" step="any" value="${D.s.toque||''}" oninput="pv('${t}')"></label>`}
 ${r?`<label>Porciento por encima que me pagan (%)<div class="fx"><input id="f-p" type="text" inputmode="decimal" value="${p}" oninput="pv('${t}')"><button type="button" class="btn alt sm" onclick="sg('f-p','${t}')">±</button></div></label><label>Porciento por encima que le pago (%)<div class="fx"><input id="f-pp" type="text" inputmode="decimal" value="${D.s.lastPP??''}" oninput="pv('${t}')"><button type="button" class="btn alt sm" onclick="sg('f-pp','${t}')">±</button></div></label>`:''}
 <label>Fecha y hora<input id="f-at" type="datetime-local" value="${nowISO()}"></label>${r?'':'<label>Nota<input id="f-note"></label>'}
 <div class="pv" id="pv"></div><button class="btn" onclick="saveOp('${t}')">Guardar operación</button>`)}
function pv(t){const u=val('f-usd'),r=val('f-rate'),p=val('f-p'),pp=val('f-pp'),d=txt('f-d'),c=u*r;
 $('#pv').innerHTML=t[0]==='r'?`${d==='remesero'?'Le debes al remesero (pendiente)':'Sale de tus fondos'}: ${n(u*(1+pp/100))} USD<br>Te deben: ${n(u*(1+p/100))} USD<br>Ganas: <b class="${p<pp?'neg':'pos'}">${n(u*(p-pp)/100)} USD</b>`:(t==='compra'?`Pagas ${n(c,0)} CUP`:`Cobras ${n(c,0)} CUP`)}
function saveOp(t){const usd=val('f-usd'),rate=val('f-rate'),who=txt('f-who');
 const r=t[0]==='r',g=t==='ing';if(usd<=0||(!r&&!g&&rate<=0)){toast(r?'Escribe el dinero enviado':g?'Escribe el monto':'Escribe el monto y la tasa');return}
 if(r&&!who){toast('Escribe el nombre');return}
 if(who&&!D.con.some(c=>c.name.toLowerCase()===who.toLowerCase()))D.con.push({id:Date.now()+1,name:who,tel:'',note:'',tipo:r?txt('f-d'):'cliente'});
 const id=Date.now(),p=r?val('f-p'):0,pp=r?val('f-pp'):0;if(r)D.s.lastPP=pp;const dest=r?txt('f-d'):'',cur=g?txt('f-cur'):'USD';D.ops.unshift({id,t,who,usd,rate,p,pp,dest,cur,at:txt('f-at')||nowISO(),note:txt('f-note'),tq:+D.s.toque||0});
 if(r){const nt=T[t]+' de '+n(usd)+' USD (me pagan +'+n(p)+'%, pago +'+n(pp)+'%)';D.pen.unshift({id:id+2,rid:id,dir:'me',who,cur:'USD',amt:+(usd*(1+p/100)).toFixed(2),due:'',note:nt,done:false});if(dest==='remesero')D.pen.unshift({id:id+3,rid:id,dir:'debo',who,cur:'USD',amt:+(usd*(1+pp/100)).toFixed(2),due:'',note:nt,done:false})}
 save();closeS();toast('Operación guardada');R()}
function ops(){return `<h2>Operaciones</h2><input id="q" placeholder="Buscar por contacto o nota" value="${esc(q)}" oninput="q=this.value;opl()" style="margin-bottom:12px"><div id="ol"></div>`}
function opl(){const s=q.toLowerCase(),L=D.ops.filter(o=>!s||(o.who+' '+o.note+' '+T[o.t]).toLowerCase().includes(s)).sort((a,b)=>b.at.localeCompare(a.at));
 if(!L.length){$('#ol').innerHTML='<div class="card mut">Aún no hay operaciones. Regístralas desde Inicio.</div>';return}
 let h='',d='';for(const o of L){const day=o.at.slice(0,10);if(day!==d){d=day;h+=`<h3>${esc(new Date(day+'T12:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}))}</h3>`}
 h+=`<div class="card" style="padding:4px 14px;margin-bottom:6px;border-left:4px solid ${o.t==='compra'?'var(--c-compra)':o.t==='venta'?'var(--c-venta)':o.t==='ing'?'var(--c-ing)':'var(--c-rem)'}"><div class="it"><div><b>${T[o.t]}</b><div class="mut">${esc(o.at.slice(11))} · ${esc(o.who||'Sin contacto')}${o.dest?' ('+o.dest+')':''}${o.note?' · '+esc(o.note):''}</div></div>
 <div style="text-align:right"><div class="num">${n(o.usd)} ${o.t==='ing'?(o.cur||'USD'):'USD'}</div>${o.t[0]==='r'?`<div class="mut">cliente recibe ${n(o.usd*(1+(o.pp||0)/100))} · te deben ${n(o.usd*(1+o.p/100))} USD</div><div class="mut ${o.p<(o.pp||0)?'neg':'pos'}">ganas ${n(o.usd*(o.p-(o.pp||0))/100)} USD (${n(o.p)}% − ${n(o.pp||0)}%)</div>`:o.t==='ing'?'':`<div class="mut">${n(o.usd*o.rate,0)} CUP a ${n(o.rate)}</div>`}
 <button class="btn alt sm" style="margin-top:6px;display:${o.img?'inline-block':'none'}" onclick="vis(${o.id})">Captura</button> <button class="btn alt sm" style="margin-top:6px;display:${o.t[0]==='r'?'inline-block':'none'}" onclick="${o.t[0]==='r'?`editPct(${o.id})`:'void 0'}">Editar %</button> <button class="btn alt sm" style="color:var(--neg);margin-top:6px" onclick="del('ops',${o.id})">${armed==='ops'+o.id?'Toca otra vez para eliminar':'Eliminar'}</button></div></div></div>`}
 $('#ol').innerHTML=h}
function del(k,id){if(armed===k+id){D[k]=D[k].filter(x=>x.id!==id);if(k==='ops')D.pen=D.pen.filter(p=>p.rid!==id);armed='';save();R()}else{armed=k+id;R();setTimeout(()=>{if(armed===k+id){armed='';R()}},3000)}}
function con(){const L=[...D.con].sort((a,b)=>a.name.localeCompare(b.name));
 return `<div class="row"><h2>Contactos</h2><button class="btn sm" onclick="conForm()">Nuevo</button></div>`+(L.length?L.map(c=>{const o=D.ops.filter(x=>x.who.toLowerCase()===c.name.toLowerCase()),tot=o.reduce((s,x)=>s+x.usd,0),pe=D.pen.filter(p=>!p.done&&p.who.toLowerCase()===c.name.toLowerCase()).length;
 return `<div class="card"><div class="row"><b>${esc(c.name)} <span class="tag">${c.tipo||'cliente'}</span></b><span><button class="btn sm" onclick="cuad(${c.id})">Cuadrar ahora</button> <button class="ic" style="font-size:13px" onclick="del('con',${c.id})">${armed==='con'+c.id?'¿Borrar?':'Borrar'}</button></span></div>
 <div class="mut">${esc(c.tel)}${c.note?' · '+esc(c.note):''}</div><div class="mut">${o.length} operaciones · ${n(tot)} USD${pe?' · '+pe+' pendientes':''}</div></div>`}).join(''):'<div class="card mut">Agrega a quienes les pagas o con quienes haces negocio.</div>')}
function conForm(){sheet(`<h2>Nuevo contacto</h2><label>Nombre<input id="c-n"></label><label>Teléfono<input id="c-t" type="tel"></label><label>Tipo<select id="c-k"><option value="cliente">Cliente</option><option value="remesero">Remesero</option></select></label><label>Nota<input id="c-o"></label><button class="btn" onclick="saveCon()">Guardar contacto</button>`)}
function saveCon(){const name=txt('c-n');if(!name){toast('Escribe el nombre');return}D.con.push({id:Date.now(),name,tel:txt('c-t'),note:txt('c-o'),tipo:txt('c-k')});save();closeS();R()}
function pen(){const op=D.pen.filter(p=>!p.done),dn=D.pen.filter(p=>p.done),sum=(d,c)=>op.filter(p=>p.dir===d&&p.cur===c).reduce((s,p)=>s+p.amt,0);
 const row=p=>`<div class="it"><div><b>${esc(p.who||'Sin nombre')}</b><div class="mut">${esc(p.note||'')}${p.due?' · vence '+esc(p.due):''}</div></div><div style="text-align:right"><div class="num ${p.dir==='debo'?'neg':'pos'}">${n(p.amt,p.cur==='CUP'?0:2)} ${p.cur}</div>
 <button class="btn alt sm" onclick="vis(${p.id})" style="${p.img?'':'display:none'}">Captura</button> <button class="btn alt sm" onclick="done(${p.id})">${p.done?'Reabrir':'Saldar'}</button> <button class="ic" style="font-size:13px" onclick="del('pen',${p.id})">${armed==='pen'+p.id?'¿Borrar?':'Borrar'}</button></div></div>`;
 return `<div class="row"><h2>Pendientes</h2><button class="btn sm" onclick="penForm()">Nueva</button></div>
 <div class="grid"><div class="card"><div class="mut">Me deben</div><div class="num pos">${n(sum('me','USD'))} USD</div><div class="num pos">${n(sum('me','CUP'),0)} CUP</div></div>
 <div class="card"><div class="mut">Debo</div><div class="num neg">${n(sum('debo','USD'))} USD</div><div class="num neg">${n(sum('debo','CUP'),0)} CUP</div></div></div>
 <div class="card" style="padding:4px 14px">${op.length?op.map(row).join(''):'<div class="mut" style="padding:10px 0">Sin cuentas pendientes.</div>'}</div>
 ${dn.length?`<h3>Saldadas</h3><div class="card" style="padding:4px 14px">${dn.map(row).join('')}</div>`:''}`}
function done(id){const p=D.pen.find(x=>x.id===id);p.done=!p.done;save();R();toast(p.done?'Saldada: efectivo actualizado':'Reabierta: efectivo revertido')}
function penForm(){sheet(`<h2>Nueva cuenta pendiente</h2><label>Tipo<select id="p-d"><option value="me">Me deben</option><option value="debo">Debo</option></select></label>
 <label>Contacto<input id="p-w" list="cl" autocomplete="off"></label><datalist id="cl">${D.con.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
 <div class="grid"><label>Monto<input id="p-a" type="number" inputmode="decimal" step="any"></label><label>Moneda<select id="p-c"><option>USD</option><option>CUP</option></select></label></div>
 <label>Fecha límite<input id="p-f" type="date"></label><label>Nota<input id="p-n"></label><button class="btn" onclick="savePen()">Guardar pendiente</button>`)}
function savePen(){const amt=val('p-a');if(amt<=0){toast('Escribe el monto');return}D.pen.unshift({id:Date.now(),dir:$('#p-d').value,who:txt('p-w'),cur:$('#p-c').value,amt,due:txt('p-f'),note:txt('p-n'),done:false});save();closeS();R()}
function calc(){const r=D.s.toque||'';
 return `<h2>Calculadoras</h2><div class="card"><b>Convertir</b><div class="grid" style="margin-top:8px"><label>USD<input id="k-u" type="number" inputmode="decimal" step="any" oninput="kc('u')"></label><label>CUP<input id="k-c" type="number" inputmode="decimal" step="any" oninput="kc('c')"></label></div>
 <label>Tasa<input id="k-r" type="number" inputmode="decimal" step="any" value="${r}" oninput="kc('u')"></label></div>
 <div class="card"><b>Remesa</b><label style="margin-top:8px">Origen<select id="m-o" onchange="km(1)"><option value="${D.s.pUS}">EEUU (+${D.s.pUS}%)</option><option value="${D.s.pEU}">Unión Europea (+${D.s.pEU}%)</option></select></label>
 <div class="grid"><label>Monto (USD)<input id="m-u" type="number" inputmode="decimal" step="any" oninput="km()"></label><label>Pago al cliente (%)<div class="fx"><input id="m-r" type="text" inputmode="decimal" value="${D.s.lastPP??''}" oninput="km()"><button type="button" class="btn alt sm" onclick="sg('m-r');km()">±</button></div></label></div><div class="pv" id="m-x"></div></div>
 <div class="card"><b>Margen de compraventa</b><div class="grid" style="margin-top:8px"><label>Compro a<input id="g-a" type="number" inputmode="decimal" step="any" oninput="kg()"></label><label>Vendo a<input id="g-b" type="number" inputmode="decimal" step="any" oninput="kg()"></label></div>
 <label>USD<input id="g-u" type="number" inputmode="decimal" step="any" oninput="kg()"></label><div class="pv" id="g-x"></div></div>`}
function kc(w){const r=val('k-r');if(w==='u'&&$('#k-u').value!=='')$('#k-c').value=+(val('k-u')*r).toFixed(2);else if(w==='c'&&r)$('#k-u').value=+(val('k-c')/r).toFixed(2)}
function km(){const u=val('m-u'),r=val('m-r'),p=val('m-o');$('#m-x').innerHTML=`Cliente recibe ${n(u*(1+r/100))} USD<br>Te deben ${n(u*(1+p/100))} USD<br><b class="${p<r?'neg':'pos'}">Ganas ${n(u*(p-r)/100)} USD</b>`+(D.s.toque?` (≈ ${n(u*(p-r)/100*D.s.toque,0)} CUP)`:'')}
function kg(){const a=val('g-a'),b=val('g-b'),u=val('g-u'),g=(b-a)*u;$('#g-x').innerHTML=`Ganas <b class="${g<0?'neg':'pos'}">${n(g,0)} CUP</b>${b?` (≈ ${n(g/b)} USD)`:''}<br>Por cada USD: ${n(b-a,0)} CUP`}
function cfg(){sheet(`<h2>Ajustes</h2><label>Modo<select id="s-t" onchange="D.s.theme=this.value;th();save()"><option value="system">Automático</option><option value="light">Claro</option><option value="dark">Oscuro</option></select></label>
 <div class="grid"><label>Me pagan por remesas de EEUU (%)<div class="fx"><input id="s-a" type="text" inputmode="decimal" value="${D.s.pUS}"><button type="button" class="btn alt sm" onclick="sg('s-a')">±</button></div></label><label>Me pagan por remesas de la UE (%)<div class="fx"><input id="s-b" type="text" inputmode="decimal" value="${D.s.pEU}"><button type="button" class="btn alt sm" onclick="sg('s-b')">±</button></div></label>
 <label>Capital inicial USD<input id="s-u" type="number" inputmode="decimal" step="any" value="${D.s.cUSD}"></label><label>Capital inicial CUP<input id="s-c" type="number" inputmode="decimal" step="any" value="${D.s.cCUP}"></label></div>
 <button class="btn" onclick="saveCfg()">Guardar ajustes</button><h3>Copia de seguridad</h3><div class="mut" style="margin-bottom:6px">Copia este texto y guárdalo en Notas. Para restaurar, pégalo aquí y toca Restaurar.</div>
 <textarea id="s-j" rows="5">${esc(JSON.stringify(D))}</textarea><button class="btn alt" style="margin-top:8px" onclick="restore()">Restaurar copia</button>`);$('#s-t').value=D.s.theme}
function saveCfg(){Object.assign(D.s,{pUS:val('s-a'),pEU:val('s-b'),cUSD:val('s-u'),cCUP:val('s-c')});save();closeS();R();toast('Ajustes guardados')}
function restore(){try{const j=JSON.parse($('#s-j').value);if(!j.ops||!j.s)throw 0;D={s:Object.assign(D.s,j.s),ops:j.ops,con:j.con||[],pen:j.pen||[],cuad:j.cuad||[]};save();th();closeS();R();toast('Copia restaurada')}catch(e){toast('El texto no es una copia válida')}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
th();R();
</script></body></html>
