<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi caja</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1E4FD8"><meta name="apple-mobile-web-app-title" content="Mi caja">
<style>
/* ===== 1. TEMA ===== */
:root{--bg:#EFF3F8;--card:#fff;--ink:#0F1B2D;--mut:#5A6B80;--line:#DCE3EC;--acc:#1E4FD8;--acc2:#0E7490;--on:#fff;--pos:#0B7A55;--neg:#C73636;--c-compra:#2563EB;--c-venta:#0B7A55;--c-rem:#B45309;--c-ing:#7C3AED;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A111F;--card:#111A2C;--ink:#E8EEF8;--mut:#8DA0BA;--line:#223250;--acc:#5B9BFF;--acc2:#22C3C3;--on:#04122A;--pos:#34D399;--neg:#F87171;--c-compra:#60A5FA;--c-venta:#34D399;--c-rem:#FBBF24;--c-ing:#A78BFA;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0A111F;--card:#111A2C;--ink:#E8EEF8;--mut:#8DA0BA;--line:#223250;--acc:#5B9BFF;--acc2:#22C3C3;--on:#04122A;--pos:#34D399;--neg:#F87171;--c-compra:#60A5FA;--c-venta:#34D399;--c-rem:#FBBF24;--c-ing:#A78BFA;color-scheme:dark}
/* ===== 2. BASE ===== */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;padding-bottom:90px;-webkit-text-size-adjust:100%}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px}
h1{font-size:22px;margin:0;font-weight:700}h2{font-size:18px;margin:4px 0 12px}h3{font-size:14px;margin:18px 0 8px;color:var(--mut);font-weight:600}
main{padding:8px 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,27,45,.06),0 6px 16px rgba(15,27,45,.05)}
.num{font-variant-numeric:tabular-nums;font-weight:700}.big{font-size:28px;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{color:var(--mut);font-size:13px}.pos{color:var(--pos)}.neg{color:var(--neg)}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);font:inherit;font-weight:700;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.97)}.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.sm{padding:6px 10px;font-size:13px;border-radius:8px;width:auto}
.ic{background:none;border:0;color:var(--mut);font-size:20px;padding:6px;cursor:pointer}
.it{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.it:last-child{border:0}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.pv{background:var(--bg);border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px;min-height:20px}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);border:0}.hero .mut{color:var(--on);opacity:.85}.hero.g2{background:linear-gradient(135deg,var(--c-venta),var(--acc2))}.hero.warn{background:linear-gradient(135deg,var(--neg),#8B1E1E)}
details>summary{cursor:pointer;font-weight:600;padding:4px 0}
/* ===== 3. NAVEGACIÓN Y HOJAS ===== */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0))}
nav button{flex:1;background:none;border:0;border-radius:12px;color:var(--mut);font:inherit;font-size:10px;padding:6px 0;cursor:pointer}
nav button b{display:flex;justify-content:center;margin-bottom:2px}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);font-weight:700;background:color-mix(in srgb,var(--acc) 14%,transparent)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}#ov.show{display:flex}
#sh{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0))}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;display:none;z-index:10}
/* ===== 4. COMPONENTES ===== */
.xs{position:relative;width:100%;max-width:340px;aspect-ratio:1/1;margin:8px auto 14px}.xs svg{position:absolute;inset:0;width:100%;height:100%}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:50%;border:3px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:11px;font-weight:600;line-height:1.1;text-align:center;cursor:pointer;position:absolute;width:27%;aspect-ratio:1/1;padding:0;transform:translate(-50%,-50%);box-shadow:0 4px 12px rgba(15,27,45,.15)}
.tile span{font-size:26px}.tile:active{transform:translate(-50%,-50%) scale(.93)}
.t-compra{border-color:var(--c-compra)}.t-venta{border-color:var(--c-venta)}.t-rUS,.t-rEU{border-color:var(--c-rem)}.t-ing{border-color:var(--c-ing);width:31%}
.fh{display:flex;align-items:center;gap:12px;margin-bottom:14px}.fh>div{flex:1}.fh .fi{font-size:34px}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.seg button{flex:1;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}.seg button.on{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700}
.amt{display:flex;align-items:center;gap:6px;margin-top:4px}.amt span{font-size:26px;font-weight:700;color:var(--acc)}.amt input{margin:0;font-size:26px;font-weight:700}
.fx{display:flex;gap:6px;align-items:center}.fx input{flex:1;min-width:0}.fx button{margin-top:4px}
.dh{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 12px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.op{padding:4px 14px;margin-bottom:6px}.op .it{padding:7px 0}.op b,.op .num{font-size:13px}.op .mut{font-size:11px}.op .btn{padding:4px 8px;font-size:11px;margin-top:6px}
.cierre{border-left:4px solid var(--acc);background:color-mix(in srgb,var(--acc) 7%,var(--card))}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin:10px 0 4px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}.bars i{display:block;width:100%;border-radius:6px 6px 0 0;min-height:3px}
.prog{height:12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.hid .num,.hid .pv b,.hid .mut b{filter:blur(9px)}
</style></head><body>
<header><h1>Mi caja</h1><span><button class="ic" onclick="hideT()" aria-label="Ocultar cifras">👁</button><button class="ic" onclick="cfg()" aria-label="Ajustes">⚙</button></span></header>
<main id="v"></main><nav id="nv"></nav>
<div id="ov" onclick="if(event.target===this)closeS()"><div id="sh"></div></div><div id="toast"></div>
<script>
/* ===== 5. DATOS (misma clave: tus datos actuales se conservan) ===== */
const $=s=>document.querySelector(s),K='mi-caja-v1',KC='mi-caja-cont';
const BK0=()=>[{id:'b1',name:'Banco 1'},{id:'b2',name:'Banco 2'},{id:'b3',name:'Banco 3'}];
const T={compra:'Compra de USD',venta:'Venta de USD',rUS:'Remesa desde EEUU',rEU:'Remesa desde la UE',ing:'Otro ingreso',gasto:'Gasto',pres:'Préstamo',tras:'Traspaso'},ICN={compra:'🛒',venta:'💵',rUS:'🇺🇸',rEU:'🇪🇺',ing:'➕',gasto:'💸',pres:'🤝',tras:'🔄'};
const X=['ing','gasto','pres','tras'],LO=()=>D.ops.filter(o=>!o.void),CJ=()=>D.cajas&&D.cajas.length?D.cajas:[{id:'c1',name:'Efectivo'}];
let D={s:{theme:'system',toque:0,tAt:'',pUS:2,pEU:3,cUSD:0,cCUP:0,meta:0},ops:[],con:[],pen:[],banks:BK0(),gan:{},cuad:[],cierres:[]},tab='home',q='',armed='',openD=new Set(),openP=new Set(),pk=[];
try{const j=JSON.parse(localStorage.getItem(K));if(j)D={...D,...j,s:{...D.s,...j.s},banks:Array.isArray(j.banks)&&j.banks.length===3?j.banks:BK0(),cierres:j.cierres||[]}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D));return true}catch(e){toast('No se pudo guardar: sin espacio. Haz una copia de seguridad.');return false}};
/* ===== 6. UTILIDADES ===== */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=(v,d=2)=>(+v||0).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const r2=v=>Math.round((+v||0)*100)/100;
const nowISO=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const val=id=>parseFloat((($('#'+id)||{}).value||'').replace(',','.'))||0,txt=id=>(($('#'+id)||{}).value||'').trim();
const dayName=d=>new Date(d+'T12:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function th(){const t=D.s.theme;t==='system'?document.documentElement.removeAttribute('data-theme'):document.documentElement.dataset.theme=t}
function sheet(h){$('#sh').innerHTML=h;$('#ov').classList.add('show')}
function closeS(){$('#ov').classList.remove('show')}
function sg(id,t){const e=$('#'+id),v=e.value.trim();e.value=v[0]==='-'?v.slice(1):'-'+v;if(t)pv(t)}
function del(k,id){if(armed===k+id){D[k]=D[k].filter(x=>x.id!==id);if(k==='ops')D.pen=D.pen.filter(p=>p.rid!==id);armed='';save();R()}else{armed=k+id;R();setTimeout(()=>{if(armed===k+id){armed='';R()}},3000)}}
/* ===== 7. LÓGICA DEL NEGOCIO (cálculo en centavos) ===== */
const k=v=>Math.round((+v||0)*100),rem=p=>r2(p.amt-(p.paid||0)),open=p=>!p.void&&rem(p)>.004;
const cn=x=>{const c=x.cid&&D.con.find(y=>y.id===x.cid);return c?c.name:(x.who||'')};
function ensureCon(nm,tipo){nm=(nm||'').trim();if(!nm)return undefined;let c=D.con.find(x=>x.name.toLowerCase()===nm.toLowerCase());if(!c){c={id:Date.now()+Math.floor(Math.random()*1e3),name:nm,tel:'',note:'',tipo:tipo||'cliente'};D.con.push(c)}return c.id}
function migrate(){if(D.v>=2)return;try{localStorage.setItem('mi-caja-pre-v2',localStorage.getItem(K)||'')}catch(e){}
 const fix=x=>{if(!x.bk&&x.who&&!x.cid)x.cid=ensureCon(x.who,x.dest==='remesero'?'remesero':undefined)};
 D.ops.forEach(fix);D.pen.forEach(p=>{fix(p);if(!p.pays){p.pays=p.done?[{a:p.amt,at:p.dAt||''}]:[];p.paid=p.done?p.amt:0}});D.v=2;save()}
function bal(lim,cj){const ok=x=>!cj||(CJ().some(c=>c.id===x.cj)?x.cj:'c1')===cj;let u=(!cj||cj==='c1')?k(D.s.cUSD):0,c=(!cj||cj==='c1')?k(D.s.cCUP):0;
 for(const o of D.ops){if(o.void||(lim&&o.at>lim))continue;const a=k(o.usd),b=k(o.usd*o.rate),cu=o.cur==='CUP';
  if(o.t==='tras'){if(cj){const g=x=>CJ().some(c=>c.id===x)?x:'c1';if(g(o.cj)===cj)cu?c-=a:u-=a;if(g(o.to)===cj)cu?c+=a:u+=a}continue}if(!ok(o))continue;
  if(o.t==='compra'){u+=a;c-=b}else if(o.t==='venta'){u-=a;c+=b}
  else if(o.t==='ing'){cu?c+=a:u+=a}else if(o.t==='gasto'){cu?c-=a:u-=a}
  else if(o.t==='pres'){const s=o.dest==='di'?-1:1;cu?c+=s*a:u+=s*a}
  else if(o.dest!=='remesero')u-=k(o.usd*(1+(o.pp||0)/100))}
 for(const p of D.pen)if(!p.void)for(const y of (p.pays||[])){if(lim&&y.at&&y.at>lim)continue;if(!ok(y))continue;const s=p.dir==='me'?1:-1;p.cur==='CUP'?c+=s*k(y.a):u+=s*k(y.a)}
 return{u:u/100,c:c/100}}
function ft(){const b=bal();let u=k(b.u),c=k(b.c);for(const p of D.pen)if(open(p)){const s=p.dir==='me'?1:-1;p.cur==='CUP'?c+=s*k(rem(p)):u+=s*k(rem(p))}return{u:u/100,c:c/100}}
function gain(o){if(o.void||X.includes(o.t))return{u:0,c:0};if(o.t[0]==='r')return{u:o.usd*(o.p-(o.pp||0))/100,c:0};if(!o.tq)return{u:0,c:0};return{u:0,c:(o.t==='venta'?o.rate-o.tq:o.tq-o.rate)*o.usd}}
const bkNm=p=>{const b=p.bk&&D.banks.find(x=>x.id===p.bk);return b?b.name:''};
const bkOwe=id=>D.pen.filter(x=>open(x)&&x.bk===id&&x.dir==='me'&&x.cur==='USD').reduce((a,x)=>a+rem(x),0);
function cierres(){const now=nowISO(),hoy=now.slice(0,10),days=new Set(D.ops.map(o=>o.at.slice(0,10)));days.add(hoy);let ch=false;
 for(const d of days){const lim=d+'T23:00';if(now<lim||D.cierres.some(c=>c.day===d))continue;
  const A=LO().filter(o=>o.at.slice(0,10)===d);if(d<hoy&&!A.length)continue;
  const b=bal(lim),gs=A.filter(o=>o.t==='gasto'),gx=gs.filter(o=>o.cur!=='CUP').reduce((a,o)=>a+o.usd,0),gy=gs.filter(o=>o.cur==='CUP').reduce((a,o)=>a+o.usd,0);let gu=0,gc=0;A.forEach(o=>{const g=gain(o);gu+=g.u;gc+=g.c});
  D.cierres.push({id:Date.now()+D.cierres.length,day:d,at:lim,u:b.u,c:b.c,gu,gc,gx,gy,fu:ft().u,fc:ft().c,n:A.length});ch=true}
 if(ch){save();if(tab==='ops'||tab==='home')R()}}
/* ===== 8. NAVEGACIÓN ===== */
const SV=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const TABS=[['home','Inicio',SV('<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>')],['ops','Operaciones',SV('<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>')],['con','Contactos',SV('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.7 0 4.5 1.8 4.5 4.5"/>')],['pen','Pendientes',SV('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>')],['calc','Calcular',SV('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M8 15h2M12 15h2M8 18h8"/>')],['cont','Contador',SV('<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 10v.01M18 14v.01"/>')]];
function go(t){tab=t;armed='';R()}
function R(){$('#nv').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[2]}</b>${t[1]}</button>`).join('');$('#v').innerHTML=({home,ops,con,pen,calc,cont})[tab]();if(tab==='ops')opl()}
/* ===== 9. INICIO ===== */
function ctd(){let mu=0,mc=0,du=0,dc=0;for(const p of D.pen)if(open(p)){const a=rem(p);if(p.dir==='me')p.cur==='CUP'?mc+=a:mu+=a;else p.cur==='CUP'?dc+=a:du+=a}
 const b=bal(),f=ft(),tq=+D.s.toque||0,L=(l,x,y,c)=>`<div class="row"><span class="mut">${l}</span><span class="num ${c||''}">${n(x)} USD · ${n(y,0)} CUP</span></div>`;
 return `<div style="margin-top:8px">${L('Efectivo',b.u,b.c)}${L('Me deben',mu,mc,'pos')}${L('Debo',du,dc,'neg')}${tq?`<div class="row"><span class="mut">Total en USD al toque</span><span class="num">${n(f.u+f.c/tq)} USD</span></div>`:''}</div>`}
function bakWarn(){const t=D.s.lastBak||'';return(!t||Date.now()-new Date(t)>6048e5)?`<div class="card row" style="border-left:4px solid var(--c-rem)"><span>💾 Haz tu copia de seguridad</span><button class="btn sm" onclick="exportF()">Guardar</button></div>`:''}
async function exportF(){const f=new File([JSON.stringify(D)],'mi-caja-'+nowISO().slice(0,10)+'.json',{type:'application/json'});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}D.s.lastBak=new Date().toISOString();save();R()}catch(e){}}
function home(){const b=bal(),F=ft(),tq=+D.s.toque||0,hoy=LO().filter(o=>o.at.slice(0,10)===nowISO().slice(0,10));let gu=0,gc=0;hoy.forEach(o=>{const g=gain(o);gu+=g.u;gc+=g.c});
 const P=[['compra',20,20,'Compra'],['venta',80,20,'Venta'],['rEU',20,80,'Remesa<br>UE'],['rUS',80,80,'Remesa<br>EEUU'],['ing',50,50,'Otros']];
 return `${bakWarn()}<div class="grid"><div class="card hero${b.u<0?' warn':''}" onclick="movs()" style="cursor:pointer"><div class="mut">Capital USD</div><div class="num big">${n(b.u)}</div></div><div class="card hero g2${b.c<0?' warn':''}" onclick="movs()" style="cursor:pointer"><div class="mut">Capital CUP</div><div class="num big">${n(b.c,0)}</div></div></div>
${tq?`<div class="card row"><span class="mut">Todo en USD al toque</span><span class="num">${n(b.u+b.c/tq)} USD</span></div>`:''}
<div class="card" style="border-left:4px solid var(--c-venta)"><div class="mut">Capital total (con lo que me deben)</div><div class="row"><span class="num big">${n(F.u)} USD</span><span class="num">${n(F.c,0)} CUP</span></div>${ctd()}</div>
${cajasCard()}<h3>Hoy</h3><div class="card"><div class="row"><span>Operaciones</span><span class="num">${hoy.length}</span></div><div class="row"><span>Ganancia en remesas</span><span class="num pos">${n(gu)} USD</span></div><div class="row"><span>Gastos del día</span><span class="num neg">${n(hoy.filter(o=>o.t==='gasto'&&o.cur!=='CUP').reduce((a,o)=>a+o.usd,0))} USD · ${n(hoy.filter(o=>o.t==='gasto'&&o.cur==='CUP').reduce((a,o)=>a+o.usd,0),0)} CUP</span></div><div class="row"><span>Margen vs. toque</span><span class="num ${gc<0?'neg':'pos'}">${n(gc,0)} CUP</span></div><div class="mut" style="margin-top:6px">🔒 El cierre del día se guarda solo a las 11:00 pm.</div></div>
<h3>Registrar</h3><div class="xs"><svg viewBox="0 0 100 100"><path d="M20 20L80 80M80 20L20 80" stroke="var(--acc)" stroke-opacity=".35" stroke-width=".8" fill="none"/></svg>${P.map(p=>`<button class="tile t-${p[0]}" style="left:${p[1]}%;top:${p[2]}%" onclick="opForm('${p[0]}')"><span>${ICN[p[0]]}</span>${p[3]}</button>`).join('')}</div><div class="grid"><button class="btn alt" onclick="gastoForm()">💸 Gasto</button><button class="btn alt" onclick="presForm()">🤝 Préstamo</button></div>`}
/* ===== 10. REGISTRO DE OPERACIONES ===== */
function rsOpts(){const L=D.con.filter(c=>c.tipo==='remesero');return L.length?'<option value="">— Elegir remesero —</option>'+L.map(c=>`<option>${esc(c.name)}</option>`).join(''):'<option value="">No tienes remeseros guardados</option>'}

function saveOp(t){const usd=val('f-usd'),rate=val('f-rate'),who=txt('f-who'),r=t[0]==='r',g=X.includes(t);
 if(usd<=0||(!r&&!g&&rate<=0)){toast(r?'Escribe el dinero enviado':g?'Escribe el monto':'Escribe el monto y la tasa');return}

 save();closeS();toast('Operación guardada');R()}

 return `<div class="card op" style="border-left:4px solid ${col}"><div class="it"><div><b>${ICN[o.t]} ${T[o.t]}</b><div class="mut">${esc(o.at.slice(11))} · ${esc(cn(o)||'Sin contacto')}${CJ().length>1?' · 🗄 '+esc((CJ().find(c=>c.id===o.cj)||CJ()[0]).name)+(o.t==='tras'?' → '+esc((CJ().find(c=>c.id===o.to)||CJ()[0]).name):''):''}${o.t==='pres'?(o.dest==='di'?' (presté)':' (me prestaron)'):o.dest?' ('+o.dest+')':''}${o.bk?' · '+((D.banks.find(b=>b.id===o.bk)||{}).name||''):''}${o.note?' · '+esc(o.note):''}</div></div>
<div style="text-align:right"><div class="num">${n(o.usd)} ${X.includes(o.t)?(o.cur||'USD'):'USD'}</div>${r?`<div class="neg mut">pagas ${n(o.usd*(1+pp/100))} USD</div><div class="pos mut">banco te debe ${n(o.usd*(1+o.p/100))} USD</div><div class="mut ${o.p<pp?'neg':'pos'}">ganas ${n(o.usd*(o.p-pp)/100)} USD</div>`:X.includes(o.t)?'':`<div class="mut">${n(o.usd*o.rate,0)} CUP a ${n(o.rate)}</div>`}
<div>${r?`<button class="btn alt sm" onclick="editPct(${o.id})">Editar %</button> `:''}<button class="btn alt sm" style="color:var(--neg)" onclick="anularForm(${o.id})">Anular</button> <button class="btn alt sm" onclick="repetir(${o.id})">🔁 Repetir</button> <button class="btn alt sm" onclick="repetir(${o.id},1)">✏️ Editar</button></div></div></div></div>`}
function opl(){const s=q.toLowerCase(),hoy=nowISO().slice(0,10),M={};

 if(!M[hoy]&&!s)M[hoy]=[];let h='';
 for(const d of Object.keys(M).sort().reverse()){const A=M[d].sort((a,b)=>b.at.localeCompare(a.at)),isH=d===hoy,open=isH||s||openD.has(d),c=D.cierres.find(x=>x.day===d),g=A.reduce((a,o)=>a+gain(o).u,0);
  h+=`<button class="dh" ${isH?'':`onclick="togD('${d}')"`}><span>📅 ${isH?'Hoy · ':''}${esc(dayName(d))}</span><span class="mut">${A.length} op · ${n(g)} USD ${isH?'':open?'▾':'▸'}</span></button>`;

   h+=A.length?A.map(opCard).join(''):'<div class="card mut">Aún no hay operaciones hoy.</div>'}}
 $('#ol').innerHTML=h}

 dbU=sum('debo','USD'),meU=sum('me','USD'),dbC=sum('debo','CUP'),meC=sum('me','CUP'),
 line=(x,u)=>{const r=Math.round(Math.abs(x));if(Math.abs(x)<.005)return`<div class="num big pos">A mano en ${u}</div>`;return`<div class="num big ${x>0?'neg':'pos'}">${x>0?'Le debes':'Te debe'} ${n(r,0)} ${u}</div>`+(Math.abs(Math.abs(x)-r)>=.005?`<div class="mut">Exacto: ${n(Math.abs(x))} ${u}</div>`:'')};

 if(L.length<2)return '<div class="card"><b>💎 Patrimonio día a día</b><div class="mut" style="margin-top:6px">Aparecerá cuando haya 2 cierres de las 11:00 pm.</div></div>';
 const V=L.map(c=>c.fu+(tq?c.fc/tq:0)),mn=Math.min(...V),mx=Math.max(...V),d=V[V.length-1]-V[0];
 return `<div class="card"><b>💎 Patrimonio día a día</b><div class="bars">${V.map((v,i)=>`<div><i style="height:${(v-mn)/((mx-mn)||1)*60+25}%;background:var(--acc)"></i>${L[i].day.slice(8)}</div>`).join('')}</div><div class="row"><span class="mut">Cambio en ${L.length} días</span><span class="num ${d<0?'neg':'pos'}">${d>0?'+':''}${n(d)} USD</span></div><div class="mut">Hoy: ${n(V[V.length-1])} USD${tq?'':' (solo USD)'}</div></div>`}
function rentCard(){const rm=LO().filter(o=>o.t[0]==='r');if(!rm.length)return'';
 const G=f=>{const m={};rm.forEach(o=>{const q=f(o),e=m[q]||(m[q]={v:0,g:0});e.v+=o.usd;e.g+=gain(o).u});return Object.entries(m).sort((a,b)=>b[1].g-a[1].g)},
 L=(t,A)=>`<div class="mut" style="margin:8px 0 2px">${t}</div>`+A.slice(0,4).map(([q,e])=>`<div class="row"><span>${esc(q)}</span><span class="num pos">${n(e.g)} USD <span class="mut">· ${n(e.v?e.g/e.v*100:0)}%</span></span></div>`).join(''),
 dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
 return `<div class="card"><b>🧠 Rentabilidad</b>${L('Por origen',G(o=>o.t==='rUS'?'🇺🇸 EEUU':'🇪🇺 UE'))}${L('Por banco',G(o=>(D.banks.find(b=>b.id===o.bk)||{}).name||'Sin banco'))}${L('Mejores días',G(o=>dias[new Date(o.at.slice(0,10)+'T12:00').getDay()]))}</div>`}
function planCard(){const op=D.pen.filter(open);if(!op.length)return'';const b=bal(),sm=(d)=>op.filter(p=>p.dir===d&&p.cur==='USD').reduce((s,p)=>s+rem(p),0),dU=sm('debo'),mU=sm('me'),
 top=d=>op.filter(p=>p.dir===d).sort((a,c)=>rem(c)-rem(a)).slice(0,3).map(p=>`<div class="row"><span>${esc(bkNm(p)||cn(p)||'—')}</span><span class="num ${d==='debo'?'neg':'pos'}">${n(rem(p),p.cur==='CUP'?0:2)} ${p.cur}</span></div>`).join('');
 return `<div class="card"><b>🗓 Plan del día</b><div class="mut" style="margin:4px 0">1. Pagar primero</div>${top('debo')||'<div class="mut">Nada por pagar</div>'}<div class="mut" style="margin:8px 0 4px">2. Cobrar primero</div>${top('me')||'<div class="mut">Nada por cobrar</div>'}<div class="pv" style="margin:8px 0 0">Proyección: si pagas todo lo que debes (${n(dU)} USD) y cobras todo (${n(mU)} USD), tu efectivo USD quedaría en <b class="${b.u-dU+mU<0?'neg':'pos'}">${n(b.u-dU+mU)}</b>.${b.u-dU<0?' <span class="neg">Necesitas '+n(dU-b.u)+' USD de efectivo antes de cobrar.</span>':''}</div></div>`}
function cotiz(){const u=val('m-u'),r=val('m-r');if(u<=0){toast('Escribe el monto');return}const t='Hola 👋 Por tu envío de '+n(u)+' USD recibes '+n(u*(1+r/100))+' USD en Cuba.';if(navigator.share)navigator.share({text:t}).catch(()=>{});else{try{navigator.clipboard.writeText(t);toast('Mensaje copiado')}catch(e){}}}
const b64=a=>{let t='';for(const x of new Uint8Array(a))t+=String.fromCharCode(x);return btoa(t)},u8=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function kdf(pw,salt){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encBak(){const pw=txt('e-p');if(pw.length<6){toast('La contraseña necesita 6 o más caracteres');return}const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await kdf(pw,salt),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(D)));shareF('mi-caja-'+nowISO().slice(0,10)+'.mcaja','text/plain',JSON.stringify({s:b64(salt),i:b64(iv),d:b64(ct)}))}
async function decBak(f){if(!f)return;try{const pw=txt('e-p'),j=JSON.parse(await f.text()),key=await kdf(pw,u8(j.s)),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(j.i)},key,u8(j.d));$('#s-j').value=new TextDecoder().decode(pt);restore()}catch(e){toast('Contraseña o archivo incorrecto')}}
/* ===== 14d. VARIAS CAJAS ===== */
let PCJ='';
function cajasCard(){return `<h3>🗄 Cajas</h3><div class="card" style="padding:4px 14px">${CJ().map(c=>{const b=bal(null,c.id);return `<div class="it" onclick="cajaForm('${c.id}')" style="cursor:pointer"><b>${esc(c.name)}</b><div style="text-align:right"><div class="num ${b.u<0?'neg':''}">${n(b.u)} USD</div><div class="mut">${n(b.c,0)} CUP</div></div></div>`}).join('')}<div class="grid" style="padding:10px 0"><button class="btn alt sm" onclick="cajaForm()">➕ Nueva caja</button><button class="btn alt sm" onclick="trasForm()">🔄 Traspaso</button></div></div>`}
function cajaForm(id){const c=id&&CJ().find(x=>x.id===id);sheet(`<h2>${c?'Renombrar caja':'Nueva caja'}</h2><label>Nombre<input id="j-n" value="${c?esc(c.name):''}" placeholder="Ej: Banco, Casa, Con Orlando"></label><button class="btn" onclick="saveCaja('${id||''}')">Guardar</button>`)}
function saveCaja(id){const nm=txt('j-n');if(!nm){toast('Escribe el nombre');return}D.cajas=CJ().map(x=>({...x}));if(id)D.cajas.find(x=>x.id===id).name=nm;else D.cajas.push({id:'c'+Date.now(),name:nm});save();closeS();R()}
function trasForm(){const C=CJ();if(C.length<2){toast('Crea al menos 2 cajas');return}const o=C.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
 sheet(`<div class="fh"><span class="fi">🔄</span><div><h2 style="margin:0">Traspaso entre cajas</h2><div class="mut">No cambia tu capital total</div></div><button class="ic" onclick="closeS()">✕</button></div><div class="grid"><label>De<select id="t-a">${o}</select></label><label>A<select id="t-b">${o}</select></label></div><div class="grid"><label>Monto<input id="t-m" type="number" inputmode="decimal" step="any"></label><label>Moneda<select id="t-c"><option>CUP</option><option>USD</option></select></label></div><label>🕒 Fecha y hora<input id="t-d" type="datetime-local" value="${nowISO()}"></label><button class="btn" onclick="saveTras()">💾 Guardar traspaso</button>`);$('#t-b').selectedIndex=1}
function saveTras(){const a=txt('t-a'),b=txt('t-b'),m=val('t-m');if(a===b||m<=0){toast(a===b?'Elige cajas distintas':'Escribe el monto');return}const nm=id=>CJ().find(c=>c.id===id).name;
 D.ops.unshift({id:Date.now(),t:'tras',who:'',usd:m,rate:0,p:0,pp:0,dest:'',cur:txt('t-c'),cj:a,to:b,at:txt('t-d')||nowISO(),note:nm(a)+' → '+nm(b),tq:+D.s.toque||0});save();closeS();toast('Traspaso guardado');R()}
function injCj(){if($('#f-cj')||CJ().length<2)return;const b=[...document.querySelectorAll('#sh .btn')].pop();if(!b)return;b.insertAdjacentHTML('beforebegin',`<label>🗄 Caja<select id="f-cj">${CJ().map(c=>`<option value="${c.id}"${c.id===(D.s.cjAct||'c1')?' selected':''}>${esc(c.name)}</option>`).join('')}</select></label>`)}
const of0=opForm,ig0=ingForm,gf0=gastoForm,pf0=presForm,py0=payForm,sp0=savePay,so1=saveOp;
opForm=function(t){of0(t);injCj()};ingForm=function(){ig0();injCj()};gastoForm=function(){gf0();injCj()};presForm=function(){pf0();injCj()};payForm=function(id){py0(id);injCj()};
savePay=function(id){PCJ=txt('f-cj');sp0(id);PCJ=''};
saveOp=function(t){const cj=txt('f-cj')||D.s.cjAct||'c1',n0=D.ops.length;so1(t);if(D.ops.length>n0){D.ops[0].cj=cj;D.s.cjAct=cj;save()}};
/* ===== 15. CONTADOR DE BILLETES ===== */
const DEN=[20000,10000,5000,2000,1000,500,200,100,50,20,10,5,1];let CC={},cArm=0;
try{CC=JSON.parse(localStorage.getItem(KC))||{}}catch(e){}
const cTot=()=>{let m=0,b=0;DEN.forEach(d=>{const c=+CC[d]||0;m+=c*d;b+=c});return{m,b}};
function cUpd(){const t=cTot();DEN.forEach(d=>{const e=$('#cs'+d);if(e)e.textContent=n((+CC[d]||0)*d,0)});$('#ct').textContent=n(t.m,0);$('#cb').textContent=t.b;cCmp()}
function cSet(d,v){CC[d]=Math.max(0,parseInt(v)||0);try{localStorage.setItem(KC,JSON.stringify(CC))}catch(e){}cUpd()}
function cAdd(d,x){cSet(d,(+CC[d]||0)+x);$('#ci'+d).value=CC[d]||''}
function cClr(){const b=$('#cx');if(!cArm){cArm=1;b.textContent='Toca otra vez para borrar todo';setTimeout(()=>{cArm=0;const e=$('#cx');if(e)e.textContent='🗑 Borrar todo'},3000);return}cArm=0;CC={};try{localStorage.setItem(KC,'{}')}catch(e){}R()}
function cont(){const t=cTot();return `<h2>Contador de dinero</h2><div class="card" style="position:sticky;top:0;z-index:2;border-left:4px solid var(--c-venta)"><div class="mut">Total contado</div><div class="row"><span class="num big" id="ct">${n(t.m,0)}</span><span class="mut"><b id="cb">${t.b}</b> billetes</span></div></div>
<div class="card"><b>⚖ Comparar con el sistema</b><label style="margin-top:8px">Moneda de lo contado<select id="cmp-c" onchange="cCmp()"><option>CUP</option><option>USD</option></select></label><label>Caja<select id="cmp-k" onchange="cCmp()">${CJ().map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><div class="pv" id="cmp">${cmpHtml('CUP')}</div></div>
<div class="card" style="padding:4px 14px">${DEN.map(d=>`<div class="it" style="align-items:center;gap:8px"><div style="min-width:62px"><b>${n(d,0)}</b></div><div style="display:flex;align-items:center;gap:6px;flex:1;justify-content:center"><button class="btn alt sm" onclick="cAdd(${d},-1)">−</button><input id="ci${d}" type="number" inputmode="numeric" min="0" placeholder="0" value="${CC[d]||''}" oninput="cSet(${d},this.value)" style="width:68px;text-align:center;margin:0"><button class="btn alt sm" onclick="cAdd(${d},1)">+</button></div><div class="num" style="min-width:84px;text-align:right" id="cs${d}">${n((+CC[d]||0)*d,0)}</div></div>`).join('')}</div><button class="btn alt" id="cx" style="color:var(--neg)" onclick="cClr()">🗑 Borrar todo</button>`}
/* ===== 16. AJUSTES Y COPIA DE SEGURIDAD ===== */
function cfg(){sheet(`<div class="row"><h2>Ajustes</h2><button class="ic" onclick="closeS()">✕</button></div><label>Modo<select id="s-t" onchange="D.s.theme=this.value;th();save()"><option value="system">Automático</option><option value="light">Claro</option><option value="dark">Oscuro</option></select></label>
<label>💱 Tasa del toque (CUP por USD)<input id="s-q" type="number" inputmode="decimal" step="any" value="${D.s.toque||''}"></label>
<div class="grid"><label>Me pagan remesas EEUU (%)<div class="fx"><input id="s-a" type="text" inputmode="decimal" value="${D.s.pUS}"><button type="button" class="btn alt sm" onclick="sg('s-a')">±</button></div></label><label>Me pagan remesas UE (%)<div class="fx"><input id="s-b" type="text" inputmode="decimal" value="${D.s.pEU}"><button type="button" class="btn alt sm" onclick="sg('s-b')">±</button></div></label><label>Capital inicial USD<input id="s-u" type="number" inputmode="decimal" step="any" value="${D.s.cUSD}"></label><label>Capital inicial CUP<input id="s-c" type="number" inputmode="decimal" step="any" value="${D.s.cCUP}"></label></div>
<button class="btn" onclick="saveCfg()">Guardar ajustes</button><h3>Aplicación</h3><div class="mut" style="margin-bottom:6px">Versión ${APP_V}</div><button class="btn alt" onclick="updApp()">🔄 Actualizar app</button><h3>🔐 Copia cifrada con contraseña</h3><label>Contraseña (6 o más caracteres)<input id="e-p" type="password" autocomplete="off"></label><button class="btn alt" onclick="encBak()">Guardar copia cifrada</button><label style="margin-top:8px">Restaurar copia cifrada<input type="file" accept=".mcaja,text/plain" onchange="decBak(this.files[0])"></label><h3>Copia de seguridad</h3><div class="mut" style="margin-bottom:6px">Copia este texto y guárdalo en Notas. Para restaurar, pégalo aquí y toca Restaurar.</div><textarea id="s-j" rows="5">${esc(JSON.stringify(D))}</textarea><button class="btn alt" style="margin-top:8px" onclick="restore()">Restaurar copia</button><button class="btn alt" style="margin-top:8px" onclick="exportF()">📁 Guardar copia en Archivos</button>`);$('#s-t').value=D.s.theme}
function saveCfg(){const tq=parseFloat(txt('s-q'))||0;if(tq!==(+D.s.toque||0)){D.s.toque=tq;D.s.tAt=nowISO()}Object.assign(D.s,{pUS:val('s-a'),pEU:val('s-b'),cUSD:val('s-u'),cCUP:val('s-c')});save();closeS();R();toast('Ajustes guardados')}
function restore(){try{const j=JSON.parse($('#s-j').value);if(!j.ops||!j.s)throw 0;D={...D,...j,s:{...D.s,...j.s},banks:Array.isArray(j.banks)&&j.banks.length===3?j.banks:BK0(),cierres:j.cierres||[]};migrate();save();th();closeS();R();toast('Copia restaurada')}catch(e){toast('El texto no es una copia válida')}}
/* ===== 17. ARRANQUE ===== */
migrate();th();if(localStorage.getItem('mi-caja-hid')==='1')document.body.classList.add('hid');R();setTimeout(cierres,800);setInterval(cierres,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)cierres()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
