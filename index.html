<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi caja</title>
<style>
:root{--bg:#EFF3F8;--card:#FFFFFF;--ink:#0F1B2D;--mut:#5A6B80;--line:#DCE3EC;--acc:#1E4FD8;--acc2:#0E7490;--on:#fff;--pos:#0B7A55;--neg:#C73636;--c-compra:#2563EB;--c-venta:#0B7A55;--c-rem:#B45309;--c-ing:#7C3AED;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A111F;--card:#111A2C;--ink:#E8EEF8;--mut:#8DA0BA;--line:#223250;--acc:#5B9BFF;--acc2:#22C3C3;--on:#04122A;--pos:#34D399;--neg:#F87171;--c-compra:#60A5FA;--c-venta:#34D399;--c-rem:#FBBF24;--c-ing:#A78BFA;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A111F;--card:#111A2C;--ink:#E8EEF8;--mut:#8DA0BA;--line:#223250;--acc:#5B9BFF;--acc2:#22C3C3;--on:#04122A;--pos:#34D399;--neg:#F87171;--c-compra:#60A5FA;--c-venta:#34D399;--c-rem:#FBBF24;--c-ing:#A78BFA;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;padding-bottom:84px;-webkit-text-size-adjust:100%}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 4px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:14px;margin:18px 0 8px;color:var(--mut);font-weight:600}
main{padding:8px 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,27,45,.06),0 6px 16px rgba(15,27,45,.05);transition:border-color .15s}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.big{font-size:28px;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{color:var(--mut);font-size:13px}.pos{color:var(--pos)}.neg{color:var(--neg)}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 10px}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}
.sm{padding:6px 10px;font-size:13px;border-radius:8px;width:auto}
.ic{background:none;border:0;color:var(--mut);font-size:20px;padding:6px;cursor:pointer}
.it{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;border-radius:12px;transition:background .15s,color .15s;color:var(--mut);font:inherit;font-size:12px;padding:6px 0;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--acc);font-weight:700;background:color-mix(in srgb,var(--acc) 14%,transparent)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
#ov.show{display:flex}
#sh{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;display:none;z-index:10}
.pv{background:var(--bg);border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px;min-height:20px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut)}
.btn{transition:transform .12s,filter .12s}.btn:active{transform:scale(.97);filter:brightness(.92)}.btn.alt:active{background:var(--bg)}nav button:active{transform:scale(.94)}.ic:active{opacity:.5}@media(hover:hover){.btn:hover{filter:brightness(1.08)}.card:hover{border-color:var(--acc)}}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--on);border:0}.hero .mut{color:var(--on);opacity:.85}.hero.g2{background:linear-gradient(135deg,var(--c-venta),var(--acc2))}.hero.warn{background:linear-gradient(135deg,var(--neg),#8B1E1E)}
.btn.b-compra{border-left:4px solid var(--c-compra)}.btn.b-venta{border-left:4px solid var(--c-venta)}.btn.b-rUS,.btn.b-rEU{border-left:4px solid var(--c-rem)}.btn.b-ing{border-left:4px solid var(--c-ing)}
.fx{display:flex;gap:6px;align-items:center}.fx input{flex:1;min-width:0}.fx button{margin-top:4px}
</style><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1E4FD8"><meta name="apple-mobile-web-app-title" content="Mi caja"></head><body>
<header><h1>Mi caja</h1><span><button class="ic" onclick="ai()" aria-label="Asistente">🤖</button><button class="ic" onclick="cfg()" aria-label="Ajustes">⚙</button></span></header>
<main id="v"></main>
<nav id="nv"></nav>
<div id="ov" onclick="if(event.target===this)closeS()"><div id="sh"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const BK0=()=>[{id:'b1',name:'Banco 1'},{id:'b2',name:'Banco 2'},{id:'b3',name:'Banco 3'}],okB=b=>Array.isArray(b)&&b.length===3?b:BK0();
let D={s:{theme:'system',toque:0,tAt:'',pUS:2,pEU:3,cUSD:0,cCUP:0},ops:[],con:[],pen:[],banks:BK0(),gan:{}},tab='home',q='',armed='',cu='',cc='';
try{const r=localStorage.getItem('mi-caja-v1');if(r){const j=JSON.parse(r);D={s:Object.assign(D.s,j.s||{}),ops:j.ops||[],con:j.con||[],pen:j.pen||[],cuad:j.cuad||[],banks:okB(j.banks),gan:j.gan||{}}}}catch(e){}
const save=()=>{try{localStorage.setItem('mi-caja-v1',JSON.stringify(D));return true}catch(e){toast('No se pudo guardar: sin espacio. Haz una copia de seguridad.');return false}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=(v,d=2)=>(+v||0).toLocaleString('es',{minimumFractionDigits:d,maximumFractionDigits:d});
const nowISO=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const T={compra:'Compra de USD',venta:'Venta de USD',rUS:'Remesa desde EEUU',rEU:'Remesa desde la UE',ing:'Otro ingreso'};
const val=id=>parseFloat((($('#'+id)||{}).value||'').replace(',','.'))||0;
const txt=id=>(($('#'+id)||{}).value||'').trim();
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function th(){const t=D.s.theme;if(t==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t}
function sheet(h){$('#sh').innerHTML=h;$('#ov').classList.add('show')}
function closeS(){$('#ov').classList.remove('show')}
function bal(){let u=+D.s.cUSD||0,c=+D.s.cCUP||0;for(const o of D.ops){const cup=o.usd*o.rate;if(o.t==='compra'){u+=o.usd;c-=cup}else if(o.t==='venta'){u-=o.usd;c+=cup}else if(o.t==='ing'){if(o.cur==='CUP')c+=o.usd;else u+=o.usd}else if(o.dest!=='remesero'){u-=o.usd*(1+(o.pp||0)/100)}}for(const p of D.pen)if(p.done){const s=p.dir==='me'?1:-1;if(p.cur==='CUP')c+=s*p.amt;else u+=s*p.amt}return{u,c}}
function gain(o){if(o.t==='ing')return{u:0,c:0};if(o.t[0]==='r')return{u:o.usd*(o.p-(o.pp||0))/100,c:0};if(!o.tq)return{u:0,c:0};return{u:0,c:(o.t==='venta'?o.rate-o.tq:o.tq-o.rate)*o.usd}}
function go(t){tab=t;armed='';R()}
function R(){
 const tabs=[['home','◎','Inicio'],['ops','☰','Operaciones'],['con','☺','Contactos'],['pen','◷','Pendientes'],['calc','＝','Calcular']];
 $('#nv').innerHTML=tabs.map(a=>`<button class="${tab===a[0]?'on':''}" onclick="go('${a[0]}')"><b>${a[1]}</b>${a[2]}</button>`).join('');
 $('#v').innerHTML=({home,ops,con,pen,calc})[tab]();
 if(tab==='ops')opl();
}
function home(){
 const b=bal(),F=ft(),tq=+D.s.toque||0,today=nowISO().slice(0,10);
 const hoy=D.ops.filter(o=>o.at.slice(0,10)===today);let gu=0,gc=0;hoy.forEach(o=>{const g=gain(o);gu+=g.u;gc+=g.c});
 const tot=tq?b.u+b.c/tq:null;
 return `<div class="card"><label>Tasa del toque (CUP por USD)<input id="tq" type="number" inputmode="decimal" step="any" value="${tq||''}" onchange="setTq(this.value)"></label>
 <div class="mut">${D.s.tAt?'Actualizada '+esc(D.s.tAt.replace('T',' ')):'Escríbela a mano cada vez que cambie.'}</div></div>
 <div class="grid"><div class="card hero${b.u<0?' warn':''}"><div class="mut">Capital USD</div><div class="num big">${n(b.u)}</div></div>
 <div class="card hero g2${b.c<0?' warn':''}"><div class="mut">Capital CUP</div><div class="num big">${n(b.c,0)}</div></div></div>
 ${tot!==null?`<div class="card row"><span class="mut">Todo en USD al toque</span><span class="num">${n(tot)} USD</span></div>`:''}
 <div class="card" style="border-left:4px solid var(--c-venta)"><div class="mut">Capital total (con lo que me deben)</div><div class="row"><span class="num big">${n(F.u)} USD</span><span class="num">${n(F.c,0)} CUP</span></div>${ctd()}</div><h3>Cuadre de caja</h3><div class="card"><div class="grid"><label>USD contados<input id="cu" type="number" inputmode="decimal" step="any" value="${cu}" oninput="cq()"></label>
 <label>CUP contados<input id="cc" type="number" inputmode="decimal" step="any" value="${cc}" oninput="cq()"></label></div><div id="cqr" class="mut"></div><button class="btn" style="margin-top:10px" onclick="cuadReg()">Registrar cuadre</button></div>${hcu()}
 <h3>Hoy</h3><div class="card"><div class="row"><span>Operaciones</span><span class="num">${hoy.length}</span></div>
 <div class="row"><span>Ganancia en remesas</span><span class="num pos">${n(gu)} USD</span></div>
 <div class="row"><span>Margen vs. toque</span><span class="num ${gc<0?'neg':'pos'}">${n(gc,0)} CUP</span></div></div>
 <h3>Registrar</h3><div class="grid">${Object.keys(T).map(t=>`<button class="btn alt b-${t}" onclick="opForm('${t}')">${T[t]}</button>`).join('')}</div>${ganUI()}`;
}
function ft(){const b=bal();let u=b.u,c=b.c;for(const p of D.pen)if(!p.done){const s=p.dir==='me'?1:-1;if(p.cur==='CUP')c+=s*p.amt;else u+=s*p.amt}return{u,c}}
function dl(){const d=txt('f-d'),L=$('#cl');if(L)L.innerHTML=D.con.filter(c=>(c.tipo||'cliente')===d).map(c=>`<option value="${esc(c.name)}">`).join('')}
const bkNm=p=>{const b=p.bk&&D.banks.find(x=>x.id===p.bk);return b?b.name:''};
const bkOwe=id=>D.pen.filter(x=>!x.done&&x.bk===id&&x.dir==='me'&&x.cur==='USD').reduce((a,x)=>a+x.amt,0);
function rsOpts(){const L=D.con.filter(c=>c.tipo==='remesero');return L.length?'<option value="">— Elegir remesero —</option>'+L.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join(''):'<option value="">No tienes remeseros guardados</option>'}
function rsel(v){const e=$('#f-who');if(e&&v)e.value=v}
function bkUI(){try{return bkUI0()}catch(e){return''}}
function bkUI0(){return `<h3>Bancos</h3><div class="card" style="padding:4px 14px">${D.banks.map(b=>`<div class="it"><div><b>${esc(b.name)}</b><div class="mut">Me debe ${n(bkOwe(b.id))} USD</div></div><button class="btn alt sm" onclick="bkName('${b.id}')">Cambiar nombre</button></div>`).join('')}</div>`}
function bkName(id){const b=D.banks.find(x=>x.id===id);sheet(`<h2>Nombre del banco</h2><label>Nombre<input id="b-n" value="${esc(b.name)}"></label><button class="btn" onclick="saveBk('${id}')">Guardar nombre</button>`)}
function saveBk(id){const nm=txt('b-n');if(!nm){toast('Escribe el nombre');return}D.banks.find(x=>x.id===id).name=nm;D.pen.forEach(x=>{if(x.bk===id)x.who=nm});save();closeS();R()}
function bkPen(){try{return bkPen0()}catch(e){return''}}
function bkPen0(){return `<h3>Bancos (me deben)</h3><div class="card" style="padding:4px 14px">${D.banks.map(b=>{const o=bkOwe(b.id);return `<div class="it"><div><b>${esc(b.name)}</b></div><div style="text-align:right"><div class="num ${o>.004?'pos':''}">${n(o)} USD</div>${o>.004?`<button class="btn alt sm" style="margin-top:6px" onclick="bkPay('${b.id}')">${armed==='bk'+b.id?'Toca otra vez para saldar':'Saldar deuda'}</button>`:''}</div></div>`}).join('')}</div>`}
function bkPay(id){if(armed==='bk'+id){let t=0;D.pen.forEach(x=>{if(!x.done&&x.bk===id&&x.dir==='me'){x.done=true;t+=x.amt}});armed='';save();R();toast('Saldado: +'+n(t)+' USD a tus fondos')}else{armed='bk'+id;R();setTimeout(()=>{if(armed==='bk'+id){armed='';R()}},3000)}}
function gdays(){const m={};D.ops.forEach(o=>{const d=o.at.slice(0,10),g=gain(o),e=m[d]||(m[d]={d,u:0,c:0,n:0});e.u+=g.u;e.c+=g.c;e.n++});return Object.values(m).sort((a,b)=>b.d.localeCompare(a.d))}
function ganUI(){try{return ganUI0()}catch(e){return''}}
function ganUI0(){const L=gdays();if(!L.length)return'';const tq=+D.s.toque||0,G=D.gan||{},T0=L.reduce((a,x)=>({u:a.u+x.u,c:a.c+x.c}),{u:0,c:0});
 return `<h3>Ganancias día a día</h3><div class="card" style="padding:4px 14px">${L.slice(0,30).map(x=>{const g=G[x.d],same=g&&Math.abs(g.u-x.u)<.005&&Math.abs(g.c-x.c)<.5;
 return `<div class="it"><div><b>${esc(new Date(x.d+'T12:00').toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short'}))}</b><div class="mut">${x.n} operaciones</div></div><div style="text-align:right"><div class="num pos">${n(x.u)} USD</div><div class="mut ${x.c<0?'neg':''}">${n(x.c,0)} CUP</div>${tq?`<div class="mut">≈ ${n(x.u+x.c/tq)} USD en total</div>`:''}<button class="btn alt sm" style="margin-top:6px" onclick="ganSave('${x.d}')">${same?'Cuadre guardado ✓':g?'Actualizar cuadre':'Guardar cuadre'}</button></div></div>`}).join('')}<div class="row" style="padding:10px 0"><b>Total</b><span class="num">${n(T0.u)} USD · ${n(T0.c,0)} CUP</span></div></div>`}
function ganSave(d){const x=gdays().find(y=>y.d===d);if(!x)return;D.gan=D.gan||{};D.gan[d]={u:x.u,c:x.c,n:x.n,at:nowISO()};save();R();toast('Cuadre del día guardado')}
function cuad(id){const c=D.con.find(x=>x.id===id);if(!c)return;
 const k=c.name.toLowerCase(),pn=D.pen.filter(x=>!x.done&&!x.bk&&x.who.toLowerCase()===k),sum=(d,u)=>pn.filter(x=>x.dir===d&&x.cur===u).reduce((s,x)=>s+x.amt,0),
 dbU=sum('debo','USD'),meU=sum('me','USD'),dbC=sum('debo','CUP'),meC=sum('me','CUP'),nu=dbU-meU,nc=dbC-meC,
 line=(x,u)=>{const r=Math.round(Math.abs(x));if(Math.abs(x)<.005)return`<div class="num big pos">A mano en ${u}</div>`;return`<div class="num big ${x>0?'neg':'pos'}">${x>0?'Le debes':'Te debe'} ${n(r,0)} ${u}</div>`+(Math.abs(Math.abs(x)-r)>=.005?`<div class="mut">Exacto: ${n(Math.abs(x),2)} ${u}</div>`:'')};
 sheet(`<h2>Cuadre con ${esc(c.name)}</h2><div class="card">${line(nu,'USD')}${Math.abs(nc)>=.005?`<div style="margin-top:8px">${line(nc,'CUP')}</div>`:''}</div>${pn.length?`<div class="card"><div class="row"><span>Le debo</span><span class="num neg">${n(dbU)} USD${dbC?' · '+n(dbC,0)+' CUP':''}</span></div><div class="row"><span>Me debe</span><span class="num pos">${n(meU)} USD${meC?' · '+n(meC,0)+' CUP':''}</span></div></div><div class="mut" style="margin-bottom:10px">Al marcar como saldado se cierran las ${pn.length} cuentas abiertas con ${esc(c.name)} y tu efectivo se ajusta.</div><button class="btn" onclick="cuadOk(${id})">Marcar todo como saldado</button>`:'<div class="mut">No hay cuentas abiertas con este contacto.</div>'}`)}
function cuadOk(id){const k=D.con.find(x=>x.id===id).name.toLowerCase();D.pen.forEach(x=>{if(!x.done&&!x.bk&&x.who.toLowerCase()===k)x.done=true});save();closeS();R();toast('Cuadre hecho')}
function vis(id){const p=D.pen.find(x=>x.id===id)||D.ops.find(x=>x.id===id);if(p&&p.img)sheet(`<h2>${esc(p.who)}</h2><img src="${p.img}" alt="Captura" style="max-width:100%;border-radius:10px">`)}
function sg(id,t){const e=$('#'+id),v=e.value.trim();e.value=v[0]==='-'?v.slice(1):'-'+v;if(t)pv(t)}
function ctd(){let mu=0,mc=0,du=0,dc=0;for(const p of D.pen)if(!p.done){if(p.dir==='me'){if(p.cur==='CUP')mc+=p.amt;else mu+=p.amt}else{if(p.cur==='CUP')dc+=p.amt;else du+=p.amt}}
 const b=bal(),f=ft(),tq=+D.s.toque||0,X=(l,x,y,k)=>`<div class="row"><span class="mut">${l}</span><span class="num ${k||''}">${n(x)} USD · ${n(y,0)} CUP</span></div>`;
 return `<div style="margin-top:8px">${X('Efectivo',b.u,b.c)}${X('Me deben',mu,mc,'pos')}${X('Debo',du,dc,'neg')}${tq?`<div class="row"><span class="mut">Total en USD al toque</span><span class="num">${n(f.u+f.c/tq)} USD</span></div>`:''}</div>`}
function hcu(){const L=D.cuad||[];if(!L.length)return'';return `<h3>Cuadres registrados</h3><div class="card" style="padding:4px 14px">${L.slice(0,5).map(x=>`<div class="it"><div><b>${esc(x.at.replace('T',' '))}</b><div class="mut">Ajuste: ${n(x.du)} USD · ${n(x.dc,0)} CUP</div></div><div class="num" style="text-align:right">${n(x.u+x.du)} USD<div class="mut">${n(x.c+x.dc,0)} CUP</div></div></div>`).join('')}</div>`}
function cuadReg(){if(cu===''&&cc===''){toast('Escribe lo que contaste');return}const b=bal(),du=cu===''?0:(parseFloat(cu)||0)-b.u,dc=cc===''?0:(parseFloat(cc)||0)-b.c;
 sheet(`<h2>Registrar cuadre</h2><div class="card"><div class="row"><span>USD en sistema</span><span class="num">${n(b.u)}</span></div><div class="row"><span>USD contados</span><span class="num">${cu===''?'—':n(parseFloat(cu)||0)}</span></div><div class="row"><span>CUP en sistema</span><span class="num">${n(b.c,0)}</span></div><div class="row"><span>CUP contados</span><span class="num">${cc===''?'—':n(parseFloat(cc)||0,0)}</span></div></div><div class="mut" style="margin-bottom:10px">Se guarda el cuadre y tus fondos quedan iguales a lo contado (ajuste: ${n(du)} USD, ${n(dc,0)} CUP).</div><button class="btn" onclick="cuadSave(${du},${dc})">Confirmar y registrar</button>`)}
function cuadSave(du,dc){const b=bal();D.cuad=D.cuad||[];D.cuad.unshift({id:Date.now(),at:nowISO(),u:b.u,c:b.c,du,dc});D.s.cUSD=(+D.s.cUSD||0)+du;D.s.cCUP=(+D.s.cCUP||0)+dc;cu='';cc='';save();closeS();R();toast('Cuadre registrado')}
